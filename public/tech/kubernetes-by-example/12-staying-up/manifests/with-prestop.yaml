# Part 12, break-it #2b — the same thing with a five-second preStop.
# An embarrassing fix for a subtle race, and it works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: with-prestop
  labels: {app: with-prestop}
spec:
  replicas: 3
  selector:
    matchLabels: {app: with-prestop}
  template:
    metadata:
      labels: {app: with-prestop}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: ["mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080, name: http}]
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh","-c","sleep 5"]}
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: with-prestop
spec:
  selector: {app: with-prestop}
  ports: [{port: 80, targetPort: http}]
