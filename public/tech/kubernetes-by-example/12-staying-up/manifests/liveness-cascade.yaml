# Part 12, break-it #1 — a health check that takes ~1.2s and a liveness
# probe using the DEFAULT timeoutSeconds: 1. Every pod is killed on a loop
# while the application works perfectly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cascade
  labels: {app: cascade}
spec:
  replicas: 3
  selector:
    matchLabels: {app: cascade}
  template:
    metadata:
      labels: {app: cascade}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: ["while true; do sleep 10; done"]
          livenessProbe:
            exec:
              command: ["/bin/sh","-c","sleep 1.2; exit 0"]
            periodSeconds: 5
            # timeoutSeconds omitted -> defaults to 1 -> always "fails"
            failureThreshold: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
