# Part 2, break-it #2 — two containers, one port, one Pod.
#
# Both try to listen on 8080. They share a network namespace, so the second
# one gets "address already in use" and dies. Proof that containers in a Pod
# are not isolated from each other the way containers normally are.
#
#   kubectl apply -f port-clash.yaml
#   kubectl logs -l demo=port-clash -c second
#   kubectl delete -f port-clash.yaml
apiVersion: v1
kind: Pod
metadata:
  name: port-clash
  labels:
    demo: port-clash
spec:
  restartPolicy: Never
  containers:
    - name: first
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "first: taking :8080"
          nc -l -p 8080

    - name: second
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          sleep 2
          echo "second: also trying :8080"
          nc -l -p 8080 || { echo "second: could not bind — the port was taken"; exit 1; }
