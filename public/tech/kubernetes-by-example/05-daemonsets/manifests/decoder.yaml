# Part 5 — the decoder, one per node.
# No replicas field exists. DESIRED is computed from how many nodes match.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: decoder
  labels: {app: decoder}
spec:
  selector:
    matchLabels: {app: decoder}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1          # counted in NODES. no surge is possible.
  template:
    metadata:
      labels: {app: decoder}
    spec:
      # A decoder serves only tuners on its own node, so it must be everywhere
      # work might land -- including nodes that repel ordinary pods.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: decoder
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          command: ["/bin/sh","-c"]
          args: ["while true; do echo \"decoder on $NODE_NAME\"; sleep 10; done"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
