# Part 13 — CPU autoscaling. Note there is no `replicas` in the Deployment:
# the HPA owns that field, and apply would fight it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  # replicas deliberately omitted -- the HPA writes it
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: ["mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}   # REQUIRED: the target is a % of this
            limits:   {cpu: 500m, memory: 64Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # 70% of the REQUEST, not of a core
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # reluctant, on purpose
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
