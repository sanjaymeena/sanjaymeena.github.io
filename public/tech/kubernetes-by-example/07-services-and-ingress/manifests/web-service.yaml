# Part 7 — a web front end behind a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              mkdir -p /www && echo "airwaves" > /www/index.html
              httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:          # only ready pods become endpoints
            tcpSocket: {port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {app: web}
spec:
  type: ClusterIP
  selector: {app: web}            # a typo here matches nothing, silently
  ports:
    - port: 80
      targetPort: http
      name: http
