# Part 8 — the same ConfigMap consumed BOTH ways, so you can compare them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuner
  labels: {app: tuner}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tuner}
  template:
    metadata:
      labels: {app: tuner}
    spec:
      volumes:
        - name: stations
          configMap:
            name: stations        # mounted as a directory -> refreshes
      containers:
        - name: tuner
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: ["while true; do sleep 10; done"]
          env:
            # A one-time copy, taken at container start. Never updates.
            - name: STATION_JAZZ_URL
              valueFrom:
                configMapKeyRef:
                  name: stations
                  key: jazz.url
            - name: STATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: station-token
                  key: token
            # The downward API: the pod reading itself.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          volumeMounts:
            - name: stations
              mountPath: /etc/stations      # directory mount -> stays in sync
          resources:
            requests: {cpu: 10m, memory: 16Mi}
