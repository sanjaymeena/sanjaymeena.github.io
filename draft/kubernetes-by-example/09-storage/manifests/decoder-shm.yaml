# Part 9 — the decoder, writing into the node's own shared memory.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: decoder
  labels: {app: decoder}
spec:
  selector:
    matchLabels: {app: decoder}
  template:
    metadata:
      labels: {app: decoder}
    spec:
      volumes:
        - name: shm
          hostPath:
            path: /dev/shm
            type: Directory       # fail loudly if it isn't there
      containers:
        - name: decoder
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "decoder up on $NODE_NAME"
              while true; do
                echo "$(date -Iseconds)" > /dev/shm/ring-jazz
                sleep 5
              done
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests: {cpu: 20m, memory: 32Mi}
