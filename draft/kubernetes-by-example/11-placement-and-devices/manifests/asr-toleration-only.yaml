# Part 11, break-it #1 — permission without direction.
# Schedules immediately, onto a node with no GPU. Exactly as asked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-wrong
  labels: {app: asr-wrong}
spec:
  replicas: 1
  selector:
    matchLabels: {app: asr-wrong}
  template:
    metadata:
      labels: {app: asr-wrong}
    spec:
      tolerations:                # nothing pulls it anywhere
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: asr
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          command: ["/bin/sh","-c"]
          args: ["echo \"landed on $NODE_NAME\"; while true; do sleep 10; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
