# Part 12, break-it #2a — no preStop. Requests arrive after SIGTERM,
# during the window while endpoint removal propagates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-prestop
  labels: {app: no-prestop}
spec:
  replicas: 3
  selector:
    matchLabels: {app: no-prestop}
  template:
    metadata:
      labels: {app: no-prestop}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: ["mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: no-prestop
spec:
  selector: {app: no-prestop}
  ports: [{port: 80, targetPort: http}]
