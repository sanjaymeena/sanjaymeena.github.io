# Part 12 — readiness first. Note timeoutSeconds: 5, not the default 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuner
  labels: {app: tuner}
spec:
  replicas: 3
  selector:
    matchLabels: {app: tuner}
  template:
    metadata:
      labels: {app: tuner}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: tuner
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              mkdir -p /www && echo ok > /www/healthz
              httpd -f -p 8080 -h /www
          ports:
            - {containerPort: 8080, name: http}
          lifecycle:
            preStop:
              exec:
                # does nothing except hold the container open while endpoint
                # removal propagates to kube-proxy on every node
                command: ["/bin/sh","-c","sleep 5"]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2        # 10s to leave the endpoint list
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5          # NOT the default 1
            failureThreshold: 3        # 30s of real trouble before a kill
          resources:
            requests: {cpu: 10m, memory: 16Mi}
