# Part 14 — the conductor needs permission for every verb on every resource
# it touches. A missing binding here is Part 13's silent 403, and the
# commonest reason a new controller appears to do nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conductor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conductor
rules:
  - apiGroups: ["airwaves.example"]
    resources: ["stations"]
    verbs: ["get","list","watch"]
  - apiGroups: ["airwaves.example"]
    resources: ["stations/status"]
    verbs: ["get","update","patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch","create","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conductor
subjects:
  - kind: ServiceAccount
    name: conductor
roleRef:
  kind: Role
  name: conductor
  apiGroup: rbac.authorization.k8s.io
