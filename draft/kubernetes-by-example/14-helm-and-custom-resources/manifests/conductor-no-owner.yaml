# Part 14, break-it #3 — the same controller with ownerReferences removed.
# Delete a Station and its pod survives, because nothing connects them.
# One orphan is trivial. Months of this is a cluster nobody can account for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  labels: {app: conductor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: conductor}
  template:
    metadata:
      labels: {app: conductor}
    spec:
      serviceAccountName: conductor
      containers:
        - name: conductor
          image: bitnami/kubectl:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "conductor: running WITHOUT ownerReferences"
              while true; do
                STATIONS=$(kubectl get stations -o jsonpath='{range .items[*]}{.metadata.name} {.spec.url}{"\n"}{end}' 2>/dev/null)
                PODS=$(kubectl get pods -l app=tuner,managed-by=conductor -o jsonpath='{range .items[*]}{.metadata.labels.station}{"\n"}{end}' 2>/dev/null)
                echo "$STATIONS" | while read NAME URL; do
                  [ -z "$NAME" ] && continue
                  if ! echo "$PODS" | grep -qx "$NAME"; then
                    echo "conductor: creating orphan-prone pod for '$NAME'"
                    kubectl run "tuner-$NAME" --image=busybox:1.36 \
                      --labels="app=tuner,station=$NAME,managed-by=conductor" \
                      --restart=Never -- sh -c "while true; do sleep 10; done" >/dev/null 2>&1 || true
                  fi
                done
                sleep 5
              done
          resources:
            requests: {cpu: 20m, memory: 48Mi}
